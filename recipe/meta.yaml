{% set name = "memory-allocator" %}
{% set version = "0.2.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/memory_allocator-{{ version }}.tar.gz
  sha256: 8c1a0432c2689b52bf3f5cb89f3d9da3cfa5fdf4cd50d18c1238740861adb8bc

build:
  number: 0
  skip: true  # [py<312]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - cross-python_{{ target_platform }}   # [build_platform != target_platform]
    - python                               # [build_platform != target_platform]
    - cython >=3.0                         # [build_platform != target_platform]
    - meson-python >=0.15.0                # [build_platform != target_platform]
    - meson >=1.2.0                        # [build_platform != target_platform]
    - ninja
  host:
    - python
    - pip
    - cython >=3.0
    - meson-python >=0.15.0
    - meson >=1.2.0
  run:
    # this is an extension to cython, so cython is needed at runtime
    - cython >=3.0
    - python

test:
  imports:
    - memory_allocator
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/sagemath/memory_allocator
  summary: An extension class to allocate memory easily with cython
  license: GPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - vincentmacri
    - isuruf
